<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>運営メニュー - QRBingo</title>
  <link rel="icon" href="../img/favicon.svg">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header class="app-header">
    <h1 class="logo"><a href="../index.html"><img src="../img/logo.svg" alt="QRBingo" width="264" height="80"></a></h1>
    <p class="tagline">運営メニュー(運営者のみ)</p>
  </header>

  <main>
    <!-- 共通メニュー(全ページ同じ)。運営は運営者ログイン時のみ欄外に表示 -->
    <nav class="tabs top-menu site-nav" aria-label="メニュー">
      <a class="tab" data-nav="online" href="../index.html">オンライン</a>
      <a class="tab" data-nav="offline" href="../index.html#offline">オフライン</a>
      <a class="tab" data-nav="mypage" href="../online/mypage.html">マイページ</a>
    </nav>
    <p class="admin-link" id="admin-link" hidden><a href="../online/admin.html">運営メニュー</a></p>

    <p id="conn-status" class="hint" style="text-align:center">接続中…</p>
    <section class="panel" id="admin-denied" hidden>
      <h2>運営メニュー</h2>
      <p class="hint">このページは運営者のみ利用できます。運営者のアカウントで <a href="mypage.html">マイページ</a> からログインしてください。</p>
    </section>

    <section class="panel" id="admin-panel" hidden>
      <h2>運営モード(全ゲーム管理)</h2>
      <p class="hint">すべてのゲームを一覧し、一時停止・終了ができます。</p>
      <div class="btn-row">
        <button class="btn-ghost" id="admin-refresh-btn" style="width:auto">一覧を更新</button>
      </div>
      <p class="hint error-text" id="admin-error"></p>
      <div id="admin-body"></div>
    </section>
  </main>

  <footer class="app-footer">
    QRBingo オンラインモード — リアルタイム配信ビンゴ
    <br>
    <a href="../index.html">トップ</a> ・
    <a href="../legal/tokushoho.html">特定商取引法に基づく表記</a> ・
    <a href="../legal/terms.html">利用規約</a> ・
    <a href="../legal/privacy.html">プライバシーポリシー</a>
  </footer>

  <script type="module" src="../js/online/admin.js"></script>
  <script type="module" src="../js/online/admin-link.js"></script>
</body>
</html>
