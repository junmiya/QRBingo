<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>プレイヤー(オンライン) - QRBingo</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎱</text></svg>">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header class="app-header">
    <h1 class="logo"><a href="../index.html"><span class="q">QR</span>Bingo</a></h1>
    <p class="tagline">プレイヤー画面(オンラインモード)</p>
  </header>

  <main>
    <p id="conn-status" class="hint" style="text-align:center">接続中…</p>

    <!-- ゲームコード入力(QR以外からの参加) -->
    <section class="panel" id="gamecode-panel" hidden>
      <h2>🎫 ゲームに参加</h2>
      <p class="hint">配信画面に表示されているゲームコードを入力してください。</p>
      <div style="display:flex; gap:8px; margin-top:10px; flex-wrap:wrap">
        <input type="text" id="in-gamecode" placeholder="例: ABCD" maxlength="8" autocomplete="off">
        <button class="btn-primary" id="gamecode-btn" style="flex-shrink:0; width:auto">次へ</button>
      </div>
    </section>

    <!-- ニックネーム入力(初回参加時のみ) -->
    <section class="panel" id="nickname-panel" hidden>
      <h2>👤 ニックネームを入力</h2>
      <p class="hint">ランキングに表示される名前です(1〜12文字)。</p>
      <div style="display:flex; gap:8px; margin-top:10px; flex-wrap:wrap">
        <input type="text" id="in-nickname" placeholder="例: たろう" maxlength="12" autocomplete="off" style="text-transform:none">
        <button class="btn-primary" id="nickname-btn" style="flex-shrink:0; width:auto">参加する</button>
      </div>
      <p class="hint error-text" id="nickname-error"></p>
    </section>

    <!-- エラー表示 -->
    <section class="panel" id="error-panel" hidden>
      <h2>⚠️ 参加できません</h2>
      <p class="hint" id="error-message"></p>
      <div class="btn-row" style="margin-top:10px">
        <button class="btn-ghost" id="error-retry-btn">別のゲームに参加</button>
      </div>
    </section>

    <!-- ゲーム画面 -->
    <div id="game-area" hidden>
      <div class="status-banner" id="status-banner">番号が呼ばれると自動でマークされます</div>

      <!-- 当選/順位パネル(ビンゴ成立後に表示) -->
      <section class="panel" id="rank-panel" hidden>
        <h2>🏆 あなたの順位</h2>
        <p class="rank-big"><span id="rank-value">-</span> 位</p>
        <div class="win-code-box" id="win-code-box" hidden>
          <p class="hint" style="margin:0 0 6px">🎁 当選しました!この当選コードを主催者に伝えてください。</p>
          <p class="win-code" id="win-code"></p>
        </div>
        <p class="hint" id="rank-note"></p>
      </section>

      <section class="panel">
        <h2>🎟️ あなたのカード <span style="float:right; color:var(--muted); font-size:.85rem; font-weight:600">ゲーム: <span id="game-label"></span></span></h2>
        <div class="card-wrap">
          <table class="bingo readonly" id="card"></table>
        </div>
        <p class="card-id-label" id="nickname-label"></p>
      </section>
    </div>
  </main>

  <footer class="app-footer">
    QRBingo オンラインモード — 番号は自動でマークされます
  </footer>

  <script src="../lib/qrcode.js"></script>
  <script src="../js/common.js"></script>
  <script type="module" src="../js/online/player.js"></script>
</body>
</html>
