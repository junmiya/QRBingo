<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ホスト - QRBingo</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎱</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <h1 class="logo"><a href="index.html"><span class="q">QR</span>Bingo</a></h1>
    <p class="tagline">ホスト画面</p>
  </header>

  <main>
    <section class="panel" id="join-panel">
      <h2>📱 参加用QRコード</h2>
      <div class="game-code" id="game-code"></div>
      <div class="qr-box" id="join-qr"></div>
      <p class="join-url" id="join-url"></p>
      <p class="hint">参加者にこのQRコードを読み取ってもらってください。ゲームコードを直接入力しても参加できます。</p>
    </section>

    <section class="panel">
      <h2>🎱 番号抽選</h2>
      <div class="ball-stage">
        <div class="ball empty" id="current-ball">
          <span class="ball-number">?</span>
        </div>
        <button class="btn-primary" id="draw-btn">抽選する!</button>
      </div>
      <div class="history" id="history"></div>
      <p class="count-note" id="count-note"></p>
    </section>

    <section class="panel">
      <h2>✅ ビンゴ検証</h2>
      <p class="hint">参加者のカードQRを読み取るか、カードIDを入力すると、現在の抽選結果に対して本当にビンゴかを検証します。</p>
      <div class="btn-row" style="margin-top:10px">
        <button id="scan-btn">📷 QRを読み取る</button>
      </div>
      <div style="display:flex; gap:8px; margin-top:10px; flex-wrap:wrap">
        <input type="text" id="verify-input" placeholder="カードID(例: ABCD-XY23K7)">
        <button id="verify-btn" style="flex-shrink:0">検証</button>
      </div>
      <div class="verify-result" id="verify-result"></div>
    </section>

    <section class="panel">
      <h2>⚙️ ゲーム管理</h2>
      <div class="btn-row">
        <button class="btn-ghost" id="reset-btn">🆕 新しいゲームを開始</button>
      </div>
      <p class="hint">新しいゲームを開始すると、ゲームコードと抽選履歴がリセットされます(参加者はカードを取り直す必要があります)。</p>
    </section>
  </main>

  <dialog id="scan-dialog">
    <h2 style="margin-top:0">カードQRを読み取り</h2>
    <video class="scanner" id="scan-video" playsinline muted></video>
    <p class="hint" id="scan-status">カメラを起動しています…</p>
    <div class="btn-row" style="margin-top:10px">
      <button class="btn-ghost" id="scan-close">閉じる</button>
    </div>
  </dialog>

  <script src="lib/qrcode.js"></script>
  <script src="lib/jsQR.js"></script>
  <script src="js/common.js"></script>
  <script src="js/host.js"></script>
</body>
</html>
