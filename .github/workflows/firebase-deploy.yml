name: Deploy to Firebase

# このブランチに push すると、Functions / Firestore Rules / Hosting を自動デプロイします。
# 認証は次のどちらかの GitHub Secret を使います(片方でOK・FIREBASE_TOKEN を優先):
#   - FIREBASE_TOKEN         : `firebase login:ci` で発行したトークン(オーナー本人の権限で最も簡単)
#   - FIREBASE_SERVICE_ACCOUNT: サービスアカウントJSON(SAを作れる場合)
on:
  push:
    branches:
      - claude/qr-code-bingo-game-y9ix04
  workflow_dispatch: {}

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install functions dependencies
        run: npm --prefix functions ci

      - name: Unit tests (gate)
        run: npm --prefix functions run test:unit

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # 認証情報を用意: FIREBASE_TOKEN を優先。無ければ FIREBASE_SERVICE_ACCOUNT(JSON)を使う。
      - name: Prepare credentials
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
            echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
          fi
          if [ -z "$FIREBASE_TOKEN" ] && [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::FIREBASE_TOKEN も FIREBASE_SERVICE_ACCOUNT も未設定です。GitHub Secrets に登録してください。"
            exit 1
          fi
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy
        run: firebase deploy --only functions,firestore:rules,hosting --project qrbingo-5c613 --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
